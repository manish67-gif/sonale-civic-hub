<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15284f"/>
      <stop offset="100%" stop-color="#0b1730"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- Outer border seal -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="2.5"/>
  <!-- Tricolor civic bar indicator -->
  <path d="M12 49 L52 49" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M12 51.5 L52 51.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M12 54 L52 54" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Classical Panchayat civic building / emblem -->
  <!-- Pediment / Roof -->
  <path d="M32 14 L17 25 L47 25 Z" fill="#f8fafc"/>
  <path d="M32 18 L24 24 L40 24 Z" fill="#e2e8f0"/>
  <!-- Architrave -->
  <rect x="18" y="25" width="28" height="3" rx="0.5" fill="#e2e8f0"/>
  <!-- Columns -->
  <rect x="20" y="28" width="4" height="13" rx="0.5" fill="#f8fafc"/>
  <rect x="30" y="28" width="4" height="13" rx="0.5" fill="#f8fafc"/>
  <rect x="40" y="28" width="4" height="13" rx="0.5" fill="#f8fafc"/>
  <!-- Base steps -->
  <rect x="16" y="41" width="32" height="3" rx="0.5" fill="#cbd5e1"/>
  <rect x="14" y="44" width="36" height="3.5" rx="0.5" fill="#94a3b8"/>
</svg>
